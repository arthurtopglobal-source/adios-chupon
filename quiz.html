<style>
:root{ --buy:#12C24F; --buy-top:#2BE06B; --buy-bot:#0FA846; --buy-h:#0C9A40; --buy-sh:rgba(16,190,74,.5);
  --nav:#2C8C86; --nav-h:#246f6a; --qink:#2A2733; }
body{ background:linear-gradient(180deg,#EAF1F6 0%,#F4EEF8 48%,var(--cream) 100%); min-height:100vh; padding-bottom:0; }
.quizx{ min-height:100vh; display:flex; flex-direction:column; }
.quizx__wrap{ width:100%; max-width:600px; margin:0 auto; padding:10px 18px 40px; flex:1; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; gap:12px; padding:10px 2px 18px; }
.topbar[hidden]{ display:none; }
.topbar__back{ background:none; border:0; font-size:1.4rem; line-height:1; color:var(--soft); cursor:pointer; padding:4px 8px; border-radius:9px; }
.topbar__back:hover{ color:var(--plum); background:#fff; }
.track{ flex:1; height:8px; background:#DCE6EC; border-radius:99px; overflow:hidden; }
.track i{ display:block; height:100%; width:0; background:var(--nav); border-radius:99px; transition:width .4s ease; }
.topbar small{ color:var(--soft); font-weight:800; font-size:.8rem; min-width:34px; text-align:right; }
.screen{ animation:fade .32s ease; flex:1; display:flex; flex-direction:column; }
@keyframes fade{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
.photo{ width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:20px; box-shadow:var(--shadow); background:#E7DAF2; }
.screen h1{ font-family:'Fredoka',sans-serif; color:var(--qink); font-size:clamp(1.55rem,6.4vw,2.15rem); line-height:1.12; margin:18px 0 .35em; letter-spacing:-.01em; }
.screen h2{ font-family:'Fredoka',sans-serif; color:var(--qink); font-size:clamp(1.35rem,5.6vw,1.8rem); line-height:1.16; margin:4px 0 .4em; }
.screen .lead{ color:var(--soft); font-size:1.06rem; margin:0 0 6px; }
.namewrap{ margin-top:20px; }
